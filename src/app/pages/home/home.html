<section class="min-h-screen flex flex-col items-center justify-center text-center text-white bg-gradient-to-b from-black via-indigo-950 to-purple-950">
  
  <!-- Imagen del título -->
  <div class="flex flex-col items-center space-y-10 animate-fade-in">
    <img
      src="sunglitch.png"
      alt="SW: The Day the Sun Glitched"
      class="w-[320px] sm:w-[420px] md:w-[500px] drop-shadow-2xl"
    />

    <!-- Botón de inicio -->
    <button
      (click)="startStory()"
      class="mt-6 bg-gradient-to-r from-yellow-400 via-orange-500 to-yellow-600 text-black font-bold text-lg px-10 py-4 rounded-full shadow-lg hover:scale-105 hover:brightness-110 transition-transform duration-300"
    >
      Start Story
    </button>
  </div>

  <!-- Pie de página -->
  <footer class="absolute bottom-6 text-sm text-gray-400">
    <p>Created for the <span class="text-yellow-400 font-semibold">NASA Space Apps Challenge 2025</span></p>
  </footer>
</section>
