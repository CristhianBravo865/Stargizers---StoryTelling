<section class="relative min-h-screen w-full overflow-hidden">
  <!-- Imagen de fondo -->
  <div
    class="absolute top-[-40px] left-0 w-full h-[calc(100vh+74px)] bg-cover bg-center overflow-hidden"
    style="background-image: url('assets/backgrounds/back.png'); clip-path: inset(0 0 40px 0);"
  ></div>

  <!-- Contenedor de historias -->
  <div
    class="relative z-10 flex flex-col items-center justify-center min-h-screen text-center text-white"
  >
    <img
      src="assets/images/sunglitch.png"
      alt="SW: The Day the Sun Glitched"
      class="w-[320px] sm:w-[420px] md:w-[500px] drop-shadow-2xl animate-fade-in -translate-y-[50px]"
      (load)="imageLoaded = true"
    />

    <button
      *ngIf="imageLoaded"
      (click)="startStory()"
      class="-translate-y-[100px] mt-6 bg-gradient-to-r from-yellow-400 via-orange-500 to-yellow-600 
             text-black font-bold text-lg px-10 py-4 rounded-full shadow-lg 
             hover:scale-105 hover:brightness-110 transition-transform duration-300 animate-fade-in-slow"
    >
      Start Story
    </button>

     <footer class="relative w-full mt-20 text-sm text-gray-400">
      <!-- Capa oscura que aparece hacia el fondo -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent pointer-events-none"></div>

      <div class="relative z-10 pb-10">
        <p>
          Created for the
          <span class="text-yellow-400 font-semibold">
            NASA Space Apps Challenge 2025
          </span>
        </p>
      </div>
    </footer>
  </div>
</section>
