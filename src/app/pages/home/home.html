<section
  class="min-h-screen bg-[url('assets/space-bg.jpg')] bg-cover bg-center flex flex-col items-center justify-center text-white"
>
  <div class="text-center mb-10 animate-fade-in">
    <h1 class="text-5xl font-bold mb-4">Welcome to Stellar Stories</h1>
    <p class="text-gray-300 text-lg max-w-xl mx-auto">
      Begin your space adventure and discover how the universe connects to us.
    </p>
  </div>

  <!-- 👇 Formulario visible solo si NO ha iniciado -->
  <div
    *ngIf="!started"
    class="bg-black/50 p-8 rounded-2xl shadow-lg w-full max-w-md animate-fade-in"
  >
    <!-- Step 1 -->
    <div *ngIf="step === 1" class="text-center">
      <h2 class="text-xl mb-4">Select your age range</h2>
      <select
        [(ngModel)]="userAge"
        (change)="nextStep()"
        class="bg-gray-800 text-white p-3 rounded-lg w-full"
      >
        <option value="" disabled selected>Select...</option>
        <option>Under 12</option>
        <option>13–17</option>
        <option>18+</option>
      </select>
    </div>

    <!-- Step 2 -->
    <div *ngIf="step === 2" class="text-center">
      <h2 class="text-xl mb-4">Select your gender</h2>
      <select
        [(ngModel)]="userGender"
        (change)="nextStep()"
        class="bg-gray-800 text-white p-3 rounded-lg w-full"
      >
        <option value="" disabled selected>Select...</option>
        <option>Female</option>
        <option>Male</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Step 3 -->
    <div *ngIf="step === 3" class="text-center">
      <h2 class="text-xl mb-4">How much do you know about space?</h2>
      <select
        [(ngModel)]="userKnowledge"
        (change)="nextStep()"
        class="bg-gray-800 text-white p-3 rounded-lg w-full"
      >
        <option value="" disabled selected>Select...</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Expert</option>
      </select>
    </div>

    <!-- Step 4 -->
    <div *ngIf="step === 4" class="text-center">
      <h2 class="text-xl mb-4">Ready to begin?</h2>
      <button
        (click)="startExperience()"
        class="bg-yellow-500 hover:bg-yellow-400 text-black px-6 py-3 rounded-lg font-semibold transition"
      >
        Start Experience
      </button>
    </div>
  </div>
</section>
