<section class="min-h-screen flex flex-col items-center justify-start py-12 px-4 bg-gradient-to-b from-slate-900 to-indigo-900 text-white">
  <!-- Profile / intro form -->
  <div *ngIf="showIntroForm" class="w-full max-w-2xl bg-white/5 border border-white/10 rounded-2xl p-6 shadow-md backdrop-blur">
    <h1 class="text-3xl font-bold mb-3 text-white">Start the experience — Lira's Story</h1>
    <p class="text-gray-300 mb-4">Choose your age range, gender and how much you know about space.</p>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
      <select [(ngModel)]="profile.ageRange" class="p-2 rounded bg-white/10">
        <option value="" disabled selected>Age range</option>
        <option value="6-9">6–9</option>
        <option value="10-12">10–12</option>
        <option value="13-15">13–15</option>
        <option value="16+">16+</option>
      </select>

      <select [(ngModel)]="profile.gender" class="p-2 rounded bg-white/10">
        <option value="" disabled selected>Gender</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other / Prefer not to say</option>
      </select>

      <select [(ngModel)]="profile.knowledge" class="p-2 rounded bg-white/10">
        <option value="beginner">I know nothing</option>
        <option value="intermediate">I know some</option>
        <option value="advanced">I know a lot</option>
      </select>
    </div>

    <div class="flex gap-3">
      <button (click)="startStory()" class="px-4 py-2 rounded bg-yellow-400 text-black font-semibold hover:opacity-90">Start Experience</button>
      <button (click)="state.clear(); profile = { ageRange: '', gender: '', knowledge: 'beginner' }" class="px-4 py-2 rounded bg-gray-700 text-white">Reset</button>
    </div>
  </div>

  <!-- Story scene -->
  <div *ngIf="!showIntroForm && currentScene" class="w-full max-w-3xl mt-8">
    <div class="bg-white/5 rounded-2xl p-6 shadow-md">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold">{{ currentScene?.title }}</h2>
        <div class="text-sm text-gray-300">
          <span *ngIf="profile.ageRange">Age: {{ profile.ageRange }}</span>
        </div>
      </div>

      <div class="mb-4">
        <img
          [src]="currentScene?.image"
          [alt]="currentScene?.title"
          class="w-full rounded-2xl shadow-lg object-cover aspect-video transition-opacity duration-500"
          (error)="handleImageError($event)"
        />
      </div>

      <p class="text-lg text-gray-200 mb-6">{{ currentScene?.text }}</p>

      <div class="flex flex-col sm:flex-row gap-3 mb-4">
        <button *ngFor="let opt of currentScene?.options"
                (click)="selectOption(opt.next)"
                class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-700">
          {{ opt.text }}
        </button>
      </div>

      <div class="flex justify-between mt-4">
        <div class="flex gap-3">
          <button (click)="back()" class="px-3 py-1 rounded bg-gray-700">Back</button>
          <button (click)="resetToStart()" class="px-3 py-1 rounded bg-red-600">Restart</button>
        </div>
        <div class="text-sm text-gray-400">Scene id: {{ currentScene?.id }}</div>
      </div>
    </div>
  </div>
</section>
