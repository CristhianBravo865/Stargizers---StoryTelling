<div class="story-container">
  <!-- 🟣 Narrador (arriba del todo) -->
  <div class="narrator" *ngIf="story.currentScene?.narration">
    {{ story.currentScene.narration }}
  </div>

  <!-- 🖼️ Escena -->
  <div class="scene-frame">
    <img
      class="scene-image"
      [src]="story.currentScene?.image"
      [alt]="story.currentScene?.title"
      (error)="onImageError($event)"
    />

    <!-- 💬 Globo de diálogo dentro de la imagen -->
    <div class="dialogue-bubble" *ngIf="story.currentScene?.dialogue">
      <p>{{ story.currentScene.dialogue }}</p>
    </div>
  </div>

  <!-- 🟢 Controles -->
  <div class="controls">
    <button (click)="prevScene()" [disabled]="story.isFirst">⟵ Back</button>
    <button (click)="nextScene()" [disabled]="story.isLast">Continue ⟶</button>
  </div>
</div>
